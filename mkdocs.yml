site_name: ragdrift
site_url: https://mukundakatta.github.io/ragdrift/
site_description: Five-dimensional drift detection for production RAG systems.
repo_url: https://github.com/MukundaKatta/ragdrift
repo_name: MukundaKatta/ragdrift
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo

nav:
  - Home: index.md
  - Concepts:
      - What is drift?: concepts/what-is-drift.md
      - Five dimensions: concepts/five-dimensions.md
  - Guides:
      - Quickstart: guides/quickstart.md
      - AWS Bedrock RAG: guides/aws-bedrock-rag.md
      - Alerting: guides/alerting.md
  - Reference:
      - API: reference/api.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

plugins:
  - search
