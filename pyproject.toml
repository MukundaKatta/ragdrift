[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
# PyPI distribution name. The bare "ragdrift" was taken by an unrelated
# project; we publish under "ragdrift-py" but the import name stays
# `ragdrift` (same convention as pyyaml/yaml, opencv-python/cv2).
name = "ragdrift-py"
version = "0.1.3"
description = "Five-dimensional drift detection for production RAG systems. Rust core, Python bindings."
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Mukunda Katta", email = "mukunda.vjcs6@gmail.com" }]
requires-python = ">=3.10"
keywords = ["rag", "drift", "embeddings", "monitoring", "llm", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
# Runtime dependency — numpy arrays are the embedding interchange type.
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
# Vector store adapters
opensearch = ["opensearch-py>=2.4,<3"]
pgvector = ["sqlalchemy>=2.0,<3", "psycopg[binary]>=3.1,<4", "pgvector>=0.2,<1"]
pinecone = ["pinecone>=5,<8"]
# Metric exporters
prometheus = ["prometheus-client>=0.19,<1"]
datadog = ["datadog-api-client>=2.20,<3"]
aws = ["boto3>=1.43.29,<2"]
# Dev / test
dev = [
    "maturin>=1.7,<2.0",
    "pytest>=8,<10",
    "pytest-mock>=3.12,<4",
    "mypy>=1.10,<2",
    "ruff>=0.5,<1",
    "numpy>=1.26,<3",
]

[project.urls]
Homepage = "https://github.com/MukundaKatta/ragdrift"
Repository = "https://github.com/MukundaKatta/ragdrift"
Documentation = "https://mukundakatta.github.io/ragdrift/"
Issues = "https://github.com/MukundaKatta/ragdrift/issues"
Changelog = "https://github.com/MukundaKatta/ragdrift/blob/main/CHANGELOG.md"

[tool.maturin]
# Build the PyO3 bindings crate, install it as ragdrift._native, vendor python/ragdrift
manifest-path = "crates/ragdrift-py/Cargo.toml"
module-name = "ragdrift._native"
python-source = "python"
features = ["extension-module"]
strip = true
# Include the workspace LICENSE files in the sdist tarball so the
# License-File metadata declared by `[project].license` resolves.
# Without this, `pip install ragdrift-py --no-binary` (sdist build) fails
# and `twine check` rejects the dist with "License-File ... does not exist".
include = [
    { path = "LICENSE-MIT", format = "sdist" },
    { path = "LICENSE-APACHE", format = "sdist" },
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
# The native module is a compiled extension; type info comes from python/ragdrift/_native.pyi.
[[tool.mypy.overrides]]
module = ["ragdrift._native"]
ignore_missing_imports = false

# Optional dependencies live behind extras; do not require them for typecheck.
[[tool.mypy.overrides]]
module = [
    "opensearchpy.*",
    "sqlalchemy.*",
    "psycopg.*",
    "pgvector.*",
    "pinecone.*",
    "prometheus_client.*",
    "datadog_api_client.*",
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/python"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
