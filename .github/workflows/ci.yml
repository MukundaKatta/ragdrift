name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust / ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, "1.75"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - name: cargo clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy -p ragdrift-core --all-targets --all-features -- -D warnings
      - name: cargo test (core)
        run: cargo test -p ragdrift-core --all-features

  python:
    name: python / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install python deps
        run: |
          uv venv --python ${{ matrix.python }} .venv
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          uv pip install maturin pytest pytest-mock numpy mypy ruff
          uv pip install opensearch-py 'sqlalchemy>=2,<3' pgvector 'pinecone>=5,<8' prometheus-client datadog-api-client boto3
        shell: bash
      - name: build extension
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          maturin develop
        shell: bash
      - name: pytest
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          pytest -v
        shell: bash
      - name: mypy
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          mypy --strict python/ragdrift
        shell: bash
      - name: ruff check
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          ruff check .
          ruff format --check .
        shell: bash
